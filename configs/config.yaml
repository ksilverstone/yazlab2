experiment:
  random_seeds: [42, 123, 2026, 7, 999]
  log_dir: "logs"
  output_dir: "outputs"

data:
  skab:
    raw_dir: "data/raw/SKAB"
    processed_dir: "data/processed/SKAB"
    group_col: "source_file"
    target_col: "anomaly"
    folders: ["valve1", "valve2"]
  batadal:
    file_path: "data/raw/BATADAL/Training_Dataset_2.csv"
    processed_dir: "data/processed/BATADAL"
    train_ratio: 0.6
    val_ratio: 0.2
    test_ratio: 0.2
    target_col: "ATT_FLAG"

preprocessing:
  scaler: "StandardScaler"
  pca_n_components: 1

deep_learning:
  max_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 5
  models:
    lstm:
      hidden_size: 64
      num_layers: 2
      dropout: 0.2
    gru:
      hidden_size: 64
      num_layers: 2
      dropout: 0.2
    cnn_1d:
      out_channels: 64
      kernel_size: 3
      dropout: 0.2

automata:
  paa_size: 4
  sax_alphabet_size: 3
  window_size: 4
  anomaly_threshold: 0.05
  noise_std: 0.1
  parameter_variations:
    window_sizes: [3, 4, 5, 6]
    alphabet_sizes: [3, 4, 5, 6]
